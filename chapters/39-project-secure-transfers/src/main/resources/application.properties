server.port=8100
spring.main.banner-mode=off
spring.datasource.url=jdbc:h2:mem:ledgerly;LOCK_TIMEOUT=10000
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
logging.level.root=WARN
# Lab-only demo secret. A real app reads it from the environment / a vault, never from git.
ledgerly.jwt.secret=lab-only-demo-secret-not-for-prod!
ledgerly.jwt.ttl-seconds=900
